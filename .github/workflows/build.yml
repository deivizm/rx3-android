name: Build APK (Fase 1)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # evita que intente instalar el obsoleto 'tools'

      - name: Instalar componentes del SDK (platform, build-tools, NDK, CMake)
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
                     "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rx3-fase1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
